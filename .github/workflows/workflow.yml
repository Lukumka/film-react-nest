name: Docker Publish

on:
  push:
    branches:
      - review-2

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/film-backend:latest ./backend

      - name: Push backend image
        run: docker push ghcr.io/${{ github.repository_owner }}/film-backend:latest

      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/film-frontend:latest ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/${{ github.repository_owner }}/film-frontend:latest